# https://packaging.python.org/tutorials/packaging-projects/

[project]
name = "ideenergy"
version = "2.0.1dev3"
dependencies = [
    "aiohttp <4.0,>=3.8",
    "python-dotenv>=1.0",
    "importlib-metadata; python_version >= '3.11'",
]
authors = [
  {name = "Luis López", email = "luis@cuarentaydos.com"},
]
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["energy", "i-de", "iberdrola", "spain", "energy-consumption", "asyncio"]
description ="Programmatic access to consumer energy consumption from https://www.i-de.es/ (Spanish energy distributor)"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"

[project.scripts]
ideenergy = "ideenergy.cli:main"

[project.urls]
Homepage = "https://github.com/ldotlopez/ideenergy"
Issues = "https://github.com/ldotlopez/ideenergy/issues"
Repository = "https://github.com/ldotlopez/ideenergy.git"

[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[bdist_wheel]
universal = 1

[tool.black]
target-version = ['py311']

[tool.isort]
profile = "black"

[tool.mypy]
files = ["ideenergy"]

[tool.pyupgrade]
addopts = "--py311-plus"

[tool.setuptools]
packages = ["ideenergy"]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipython>=9.8.0",
    "pre-commit>=4.5.1",
]
